[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anyaria"
version = "0.1.0"
description = "AI-powered circuit design for KiCad"
authors = [{name = "AnyAria Contributors", email = "pachecked@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["kicad", "circuit-design", "ai", "claude", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
# circuit-synth with JLC integration and hierarchical blocks
# Uses paycheckpacheck's PRs:
# - feat/jlc-import-components (JLCPCB component import)
# - feat/circuit-generation-agents (Hierarchical block generation)
circuit-synth = [
    "circuit-synth @ git+https://github.com/circuit-synth/circuit-synth.git@feat/jlc-import-components",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "ruff>=0.0.280",
]

[project.urls]
Homepage = "https://github.com/circuit-synth/AnyAria"
Documentation = "https://github.com/circuit-synth/AnyAria#readme"
Repository = "https://github.com/circuit-synth/AnyAria"
Issues = "https://github.com/circuit-synth/AnyAria/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anyaria"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/anyaria --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G", "PIE", "T20", "PT", "Q", "RET", "SIM", "TID", "ARG", "ERA", "PD", "PGH", "PL", "TRY", "RUF"]
ignore = ["E501"]  # Line length handled by black

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
